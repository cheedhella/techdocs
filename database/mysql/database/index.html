        <div class="answer">
            <ul>
                <li>Index is a special lookup structure created on one or more columns;</li>
                <li>Without index, it scans the entire table;</li>
                <li>With index, it quickly locates the matching rows;</li>
                <li>Indexes improve query performance by helping MySQL find rows faster;</li>
            </ul>
