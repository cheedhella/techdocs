    <body>
        <div class="main-grid-item main-grid-item-1 grid-wide-column">
            <h2>The SELECT Statement</h2>
        </div>
        <div class="content-container" style="padding: 20px;">
            <p>The <code>SELECT</code> statement is used to select data from a database.</p>
            <pre><code class="sql">
-- Select all columns
SELECT * FROM customers;

-- Select specific columns
SELECT customer_name, city FROM customers;
            </code></pre>
