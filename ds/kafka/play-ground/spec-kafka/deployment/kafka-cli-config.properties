# Kafka CLI Configuration
# Use this file with Kafka command-line tools
# Example: kafka-consumer-groups.sh --bootstrap-server ... --command-config kafka-cli-config.properties

# Bootstrap servers
bootstrap.servers=10.253.228.200:9092

# Security configuration (uncomment and configure if your cluster requires authentication)

# For SASL/PLAIN authentication:
#security.protocol=SASL_PLAINTEXT
#sasl.mechanism=PLAIN
#sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
#  username="your-username" \
#  password="your-password";

# For SASL/SCRAM authentication:
#security.protocol=SASL_PLAINTEXT
#sasl.mechanism=SCRAM-SHA-256
#sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required \
#  username="your-username" \
#  password="your-password";

# For SSL authentication:
#security.protocol=SSL
#ssl.truststore.location=/path/to/truststore.jks
#ssl.truststore.password=truststore-password
#ssl.keystore.location=/path/to/keystore.jks
#ssl.keystore.password=keystore-password
#ssl.key.password=key-password

# For SASL_SSL:
#security.protocol=SASL_SSL
#sasl.mechanism=PLAIN
#sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
#  username="your-username" \
#  password="your-password";
#ssl.truststore.location=/path/to/truststore.jks
#ssl.truststore.password=truststore-password

# Request timeout
request.timeout.ms=30000
session.timeout.ms=30000

