<!DOCTYPE html>
<html lang="en">
    <head>
        <title>How to remove duplicate elements from a sorted Single Linked List?</title>
        <link rel="stylesheet" href="../../resources/css/styles.css" />
        <link rel="stylesheet" href="../../resources/css/highlight.min.css" />
        <script src="../../resources/js/highlight.min.js"></script>
        <script>
            hljs.initHighlightingOnLoad();
        </script>
    </head>
    <body>
        <div>
            <div class="question"><strong>How to remove duplicate elements from a sorted Single Linked List?</strong></div>
            <div class="answer">
                For each node in the list, 
                <ul>
                    <li>Compare it with it's next node;</li>
                    <li>If same, remove current node;</li>
                    <li>If head is same as removed node, reset head to next node;</li>
                </ul>
                Complexity: It takes O(N) time;
            </div>
    </body>
</html>
