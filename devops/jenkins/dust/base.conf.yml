# Version update actions ######################################

  set-build-versions:
    - command: |
        echo "WHOAMI: $(whoami)"
        echo "HOSTNAME: $(hostname)"
        echo "PWD: $(pwd)"
        echo "MAVEN REPOSITORY: {{maven-repository}}"
        echo "Setting build/versions/integration.conf.yml version to: {{new-version}}"
        sed -i "0,/version: [0-9.]*/s//version: {{new-version}}/" build/versions/integration.conf.yml
  commit-version-changes:
    - command: |
        echo "WHOAMI: $(whoami)"
        echo "HOSTNAME: $(hostname)"
        echo "PWD: $(pwd)"
        echo "MAVEN REPOSITORY: {{maven-repository}}"
        echo "Committing the following files: "
        git status
        git commit -a -m "{{story-number}} - version updated for {{new-version}}"
        git status
  push-version-changes:
    - command: |
        echo "WHOAMI: $(whoami)"
        echo "HOSTNAME: $(hostname)"
        echo "PWD: $(pwd)"
        echo "MAVEN REPOSITORY: {{maven-repository}}"
        
        echo "Pushing commit to checked out branch"
        git push -u origin HEAD:{{branch}}
