apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "user-crud-app.fullname" . }}-test"
  labels:
    {{- include "user-crud-app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: curl-test
      image: curlimages/curl:latest
      command: ['curl']
      args: ['--fail', '-s', 'http://{{ include "user-crud-app.fullname" . }}:{{ .Values.service.port }}/api/users']
