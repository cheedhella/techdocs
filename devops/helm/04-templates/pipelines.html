    <div class="main-grid-item-1 grid-wide-column">
        <h2>Pipeline</h2>
    </div>

    <div class="question"><strong>1. What is Pipeline?</strong></div>
    <div class="answer">
        <ul>
            <li>Pipelines chain functions together, passing each result to the next function;</li>
            <li>Syntax: <pre><code>{{ expression | function1 | function2 | ... }}</code></pre></li>
            <li>Eg: name: {{ .Values.name | lower | trunc 63 | trimSuffix "-" }}</li>
        </ul>
    </div>
</body>
