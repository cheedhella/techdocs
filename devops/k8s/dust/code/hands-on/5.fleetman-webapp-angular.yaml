apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetman-webapp-angular-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fleetman-webapp-angular-pod-label
  template:
    metadata:
      labels:
        app: fleetman-webapp-angular-pod-label
    spec:
      containers:
        - name: fleetman-webapp-angular-container
          image: 'richardchesterwood/k8s-fleetman-webapp-angular:release2'
          env:
          - name: SPRING_PROFILES_ACTIVE
            value: production-microservice
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-webapp
spec:
  type: NodePort
  selector:
    app: fleetman-webapp-angular-pod-label
  ports:
    - name: http
      port: 80
      nodePort: 30080