apiVersion: apps/v1
kind: Deployment
metadata:
  name: np-dep
spec:
  replicas: 3
  selector:
    matchLabels:
      app: np-pod
  template:
    metadata:
      labels:
        app: np-pod
    spec:
      containers:
      - name: np-c1
        image: hashicorp/http-echo
        args:
          - "-text=Hello from $(POD_IP)"
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
        ports:
          - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: np-svc
spec:
  type: NodePort
  selector:
    app: np-pod
  ports:
    - port: 80              # Cluster IP Internal Port, only internal services can access the service using this port(unless exposed using load balancer/ingress);
      targetPort: 5678      # Port on which pods are listening;
      nodePort: 30080       # External port on every node (optional — auto-assigned if omitted); Should be always in range 30000–32767; 
