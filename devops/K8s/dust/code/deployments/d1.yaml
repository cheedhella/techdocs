apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-first-deployment
spec:                                 # Same as Replicaset!
  replicas: 2
  selector:
    matchLabels:
      app: webtesting
  template:
    metadata:
      labels:
        app: webtesting
    spec:
      containers:
        - name: webtesting
          image: 'sandeepbaldawa/webserver-testing:v1'
          ports:
            - containerPort: 80
          imagePullPolicy: Always
