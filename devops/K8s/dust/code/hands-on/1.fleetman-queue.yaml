apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetman-queue-deployment
spec:
  replicas: 1
  selector:                                       # It manages all pods with specified label!
    matchLabels:
      app: fleetman-queue-pod-label
  template:
    metadata:                                     # No need to give Pods a name, Replicaset/Deployment takes care of it;
      labels:                                     # Give this label to every pod created!
        app: fleetman-queue-pod-label
    spec:
      containers:
        - name: fleetman-queue-container
          image: richardchesterwood/k8s-fleetman-queue:release2       # 
---
apiVersion: v1
kind: Service
metadata:
  name: fleetman-queue                                  # IMPORTANT: position-simulator service expects this service name to be fleetman-queue;
spec:
  type: NodePort
  selector:
    app: fleetman-queue-pod-label
  ports:
    - name: http                                        # You can give any name;
      port: 8161                                        # 8161 is for the admin console;
      nodePort: 30010                                   # Expose admin console using 30010;
    - name: endpoint
      port: 61616                                       # Port 61616 is used to send/receive messages; As it is used internally in the cluster, we don't need NodePort;