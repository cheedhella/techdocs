apiVersion: v1
kind: Pod
metadata:
  name: mc3
  labels:
    app: mc3
spec:
  containers:
    - name: webapp
      image: training/webapp                  # Hello World Python WebApp
    - name: nginx
      image: 'nginx:alpine'
      ports:
        - containerPort: 80                   # It acts as a reverse proxy: It takes requests on port 80 and forwards them to localhost:5000;
      volumeMounts:
        - name: nginx-proxy-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
  volumes:
    - name: nginx-proxy-config
      configMap:
        name: mc3-nginx-conf