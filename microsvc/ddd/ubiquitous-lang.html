<body>
    <div class="question"><strong>1. What is Ubiquitous Language?</strong></div>
    <div class="answer">
        <ul>
            <li>Ubiquitous Language is a shared language that is used by developers (in code and documentation) and business experts, to communicate about the domain;</li>
            <li>For eg: If the business says Order, don’t call it Transaction in code;</li>
        </ul>
    </div>
