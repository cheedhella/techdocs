<body>
    <div class="question"><b>1. What is a Domain Service?</b></div>
    <div class="answer">
        <ul>
            <li>It is used when business logic doesn't belong to a single entity; It involves multiple entities;</li>
            <li><b>Eg:</b> Payment processing, Inventory management, etc;</li>
        </ul>
    </div>
