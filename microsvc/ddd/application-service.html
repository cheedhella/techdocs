<body>
    <div class="question"><b>1. What is a Application Service?</b></div>
    <div class="answer">
        <ul>
            <li>It is a service that is used to coordinate with domain services; It doesn't contain any business logic;</li>
            <li><b>Eg:</b> Receive request → Call domain services → Return result;</li>
        </ul>
    </div>
</body>
